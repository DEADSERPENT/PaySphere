<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaySphere · Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Sora:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="scene">
    <div class="blob blob--coral" aria-hidden="true"></div>
    <div class="blob blob--sage" aria-hidden="true"></div>
    <div class="blob blob--sand" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar reveal" style="--d: 0">
      <div class="brand">
        <span class="brand-orb">
          <span class="brand-orb-ring"></span>
        </span>
        <span class="brand-name">PaySphere</span>
      </div>
      <div class="trust-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 2L4 5v6c0 5.25 3.4 9.74 8 11 4.6-1.26 8-5.75 8-11V5l-8-3z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Secured checkout</span>
      </div>
    </header>

    <main class="stage">
      <section class="checkout-card reveal" style="--d: 1" aria-labelledby="checkout-title">
        <div class="clay-chip reveal" style="--d: 2" aria-hidden="true">
          <div class="clay-chip-notch"></div>
          <div class="clay-chip-lines">
            <span></span><span></span><span></span>
          </div>
        </div>

        <h1 id="checkout-title" class="reveal" style="--d: 2">Complete your&nbsp;payment</h1>
        <p class="card-subtitle reveal" style="--d: 3">Razorpay Standard Checkout · Test mode</p>

        <form id="checkout-form" class="reveal" style="--d: 4">
          <div class="field amount-field">
            <label for="amount">Amount</label>
            <div class="amount-input-wrap">
              <span class="currency-symbol">₹</span>
              <input type="number" id="amount" min="1" step="0.01" value="10.00" inputmode="decimal" required />
            </div>
            <div class="quick-amounts" role="group" aria-label="Quick amount select">
              <button type="button" class="chip" data-amount="10">₹10</button>
              <button type="button" class="chip" data-amount="50">₹50</button>
              <button type="button" class="chip" data-amount="100">₹100</button>
              <button type="button" class="chip" data-amount="500">₹500</button>
            </div>
          </div>

          <div class="field">
            <label for="orderId">Order reference</label>
            <input type="text" id="orderId" maxlength="40" required />
          </div>

          <button type="submit" id="pay-button" class="pay-btn">
            <span class="pay-btn-sheen" aria-hidden="true"></span>
            <span class="pay-btn-content">
              <svg class="pay-btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="7" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="1.8" />
                <path d="M7 7V6a5 5 0 0 1 10 0v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              <span class="pay-btn-label">Pay now</span>
            </span>
            <span class="pay-btn-spinner" aria-hidden="true"></span>
          </button>
        </form>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <div class="payment-methods reveal" style="--d: 5">
          <span>UPI</span>
          <span class="dot"></span>
          <span>Cards</span>
          <span class="dot"></span>
          <span>Netbanking</span>
          <span class="dot"></span>
          <span>Wallets</span>
        </div>
      </section>
    </main>

    <footer class="foot-note reveal" style="--d: 6">
      Powered by <strong>PaySphere</strong> 
    </footer>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/checkout.js"></script>
</body>
</html>
