<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaySphere · Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Sora:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="scene">
    <div class="blob blob--coral" aria-hidden="true"></div>
    <div class="blob blob--sage" aria-hidden="true"></div>
    <div class="blob blob--sand" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar reveal" style="--d: 0">
      <div class="brand">
        <span class="brand-orb">
          <span class="brand-orb-ring"></span>
        </span>
        <span class="brand-name">PaySphere</span>
      </div>
      <div class="trust-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 2L4 5v6c0 5.25 3.4 9.74 8 11 4.6-1.26 8-5.75 8-11V5l-8-3z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Secured checkout</span>
      </div>
    </header>

    <main class="stage">
      <section class="checkout-card reveal" id="checkout-card" style="--d: 1" aria-labelledby="checkout-title">
        <div class="clay-chip reveal" style="--d: 2" aria-hidden="true">
          <div class="clay-chip-notch"></div>
          <div class="clay-chip-lines">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div class="card-face card-face--default" id="card-default">
          <h1 id="checkout-title" class="reveal" style="--d: 2">Complete your&nbsp;payment</h1>
          <p class="card-subtitle reveal" style="--d: 3">Secure payment · Test mode</p>

          <form id="checkout-form" class="reveal" style="--d: 4">
            <div class="field amount-field">
              <label for="amount">Amount to pay</label>
              <div class="amount-input-wrap">
                <span class="currency-symbol">₹</span>
                <input type="number" id="amount" min="1" step="0.01" value="10.00" inputmode="decimal" required />
              </div>
              <div class="quick-amounts" role="group" aria-label="Quick amount select">
                <button type="button" class="chip" data-amount="10">₹10</button>
                <button type="button" class="chip" data-amount="50">₹50</button>
                <button type="button" class="chip" data-amount="100">₹100</button>
                <button type="button" class="chip" data-amount="500">₹500</button>
              </div>
            </div>

            <div class="field">
              <label for="orderId">Order reference</label>
              <div class="ref-display">
                <input type="text" id="orderId" readonly tabindex="-1" />
                <button type="button" class="copy-btn" id="copy-order-id" data-copy-target="orderId" aria-label="Copy order reference">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="8" y="8" width="12" height="12" rx="2.2" stroke="currentColor" stroke-width="1.8" />
                    <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.8" />
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" id="pay-button" class="pay-btn">
              <span class="pay-btn-sheen" aria-hidden="true"></span>
              <span class="pay-btn-content">
                <svg class="pay-btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="3" y="7" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="1.8" />
                  <path d="M7 7V6a5 5 0 0 1 10 0v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
                <span class="pay-btn-label">Pay ₹10.00</span>
              </span>
              <span class="pay-btn-spinner" aria-hidden="true"></span>
            </button>
          </form>

          <div id="status" class="status" role="status" aria-live="polite"></div>

          <div class="payment-methods reveal" style="--d: 5">
            <span>UPI</span>
            <span class="dot"></span>
            <span>Cards</span>
            <span class="dot"></span>
            <span>Netbanking</span>
            <span class="dot"></span>
            <span>Wallets</span>
          </div>
        </div>

        <div class="card-face card-face--result card-face--success" id="card-success" hidden>
          <div class="result-icon result-icon--success" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
              <path d="M5 13l5 5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <h2>Payment successful</h2>
          <div class="result-amount" id="success-amount">₹0.00</div>
          <p class="result-sub">Order confirmed</p>
          <div class="ref-display ref-display--result">
            <input type="text" id="success-order-id" readonly tabindex="-1" />
            <button type="button" class="copy-btn" data-copy-target="success-order-id" aria-label="Copy order reference">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="8" y="8" width="12" height="12" rx="2.2" stroke="currentColor" stroke-width="1.8" />
                <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.8" />
              </svg>
            </button>
          </div>
          <button type="button" class="pay-btn result-btn" id="done-button">Done</button>
          <p class="result-footnote">Transaction verified securely</p>
        </div>

        <div class="card-face card-face--result card-face--failure" id="card-failure" hidden>
          <div class="result-icon result-icon--failure" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M12 8v5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
              <circle cx="12" cy="16.2" r="1.1" fill="currentColor" />
            </svg>
          </div>
          <h2>Payment failed</h2>
          <p class="result-message" id="failure-message">We couldn't complete this payment.</p>
          <div class="ref-display ref-display--result">
            <input type="text" id="failure-order-id" readonly tabindex="-1" />
            <button type="button" class="copy-btn" data-copy-target="failure-order-id" aria-label="Copy order reference">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="8" y="8" width="12" height="12" rx="2.2" stroke="currentColor" stroke-width="1.8" />
                <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.8" />
              </svg>
            </button>
          </div>
          <button type="button" class="pay-btn result-btn" id="retry-button">Try again</button>
        </div>
      </section>
    </main>

    <footer class="foot-note reveal" style="--d: 6">
      Powered by <strong>PaySphere</strong>
    </footer>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="/checkout.js"></script>
</body>
</html>
